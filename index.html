<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TecKids</title>
</head>
<body>
  
    <header>
        <div id="logo">
            <h1>TecKids</h1>
            <img src="imagens/Design sem nome.png">
          
        </div>

        <div class="nav-bar">
            <div class="nav-list">
                <ul>
                    <li class="nav-item"><a href="/index.html" class="nav-link">Início</a></li>
                    <li class="nav-item"><a href="/sobre.html" class="nav-link">Sobre</a></li>
                    <li class="nav-item"><a href="/contato.html" class="nav-link">Contato</a></li>
                </ul>
            </div>
        </div>

       
    </header>
    

    <div class="slider">

        <div class="slides">
            <input type="radio" name="radio-btn" id="radio1">
            <input type="radio" name="radio-btn" id="radio2">
            <input type="radio" name="radio-btn" id="radio3">
            <input type="radio" name="radio-btn" id="radio4">
            <input type="radio" name="radio-btn" id="radio5">
            <input type="radio" name="radio-btn" id="radio6">
            <input type="radio" name="radio-btn" id="radio7">

            <div class="slide first">
                <img src="imagens/1.png" alt="Imagem 1"/>
            </div>
            <div class="slide">
                <img src="imagens/2.png" alt="Imagem 2">
            </div>
            <div class="slide">
                <img src="imagens/3.png" alt="Imagem 3">
            </div>
            <div class="slide">
                <img src="imagens/4.png" alt="Imagem 4">
            </div>
            <div class="slide">
                <img src="imagens/5.png" alt="Imagem 5">
            </div>
            <div class="slide">
                <img src="imagens/6.png" alt="Imagem 6">
            </div>
            <div class="slide">
                <img src="imagens/7.png" alt="Imagem 7">
            </div>

            <div class="navigation-auto">
                <div class="auto-btn1"></div>
                <div class="auto-btn2"></div>
                <div class="auto-btn3"></div>
                <div class="auto-btn4"></div>
                <div class="auto-btn5"></div>
                <div class="auto-btn6"></div>
                <div class="auto-btn7"></div>
            </div>

        </div>


        <div class="manual-navigation">
            <label for="radio1" class="manual-btn"></label>
            <label for="radio2" class="manual-btn"></label>
            <label for="radio3" class="manual-btn"></label>
            <label for="radio4" class="manual-btn"></label>
            <label for="radio5" class="manual-btn"></label>
            <label for="radio6" class="manual-btn"></label>
            <label for="radio7" class="manual-btn"></label>
        </div>
    </div>



      <div class="footer">
            ©Ana Julia Lindholm
        </div>

        <script src="script.js"></script>

</body>
</html>
